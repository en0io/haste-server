<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Hastebin</title>
		<meta
			name="description"
				content="Hastebin is a fast, minimal pastebin for code and text. Paste a snippet, get syntax highlighting and a short link to share in seconds."
		/>
		<link rel="canonical" href="https://en0.sh/" />
		<meta name="robots" content="index,follow" />

		<!-- Preload holocdn, our domain we host static content like fonts from -->
		<link rel="preconnect" href="https://s.holocdn.net/" />

		<!-- Link previews (Open Graph / Twitter) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Hastebin" />
		<meta property="og:title" content="Hastebin - fast, simple pastebin for code and text" />
		<meta
			property="og:description"
			content="Hastebin is a fast, minimal pastebin for code and text. Paste a snippet, get syntax highlighting and a short link to share in seconds."
		/>
		<meta property="og:url" content="https://en0.sh/" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:image" content="https://en0.sh/seo/android-chrome-512x512.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:image:alt" content="The Hastebin logo" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Hastebin - fast, simple pastebin for code and text" />
		<meta
			name="twitter:description"
			content="Hastebin is a fast, minimal pastebin for code and text. Paste a snippet, get syntax highlighting and a short link to share in seconds."
		/>
		<meta name="twitter:image" content="https://en0.sh/seo/android-chrome-512x512.png" />
		<meta name="twitter:image:alt" content="The Hastebin logo" />

		<!-- Icons and installability -->
		<link rel="manifest" href="/seo/site.webmanifest" />
		<link rel="icon" type="image/png" sizes="16x16" href="/seo/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/seo/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/seo/android-chrome-192x192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/seo/apple-touch-icon.png" />
		<link rel="apple-touch-startup-image" href="/seo/apple-startup.png" />
		<link rel="mask-icon" href="/seo/safari-pinned-tab.svg" color="#1e88e5" />

		<!-- Platform chrome -->
		<meta name="application-name" content="Hastebin" />
		<meta name="apple-mobile-web-app-title" content="Hastebin" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="msapplication-config" content="/seo/browserconfig.xml" />
		<meta name="msapplication-TileColor" content="#282C34" />
		<meta name="theme-color" content="#282C34" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Hastebin",
				"url": "https://en0.sh/",
				"description": "Hastebin is a fast, minimal pastebin for code and text. Paste a snippet, get syntax highlighting and a short link to share in seconds.",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Any",
				"browserRequirements": "Requires JavaScript.",
				"inLanguage": "en"
			}
		</script>
	</head>

	<body>
		<script type="module" src="/src/main.ts"></script>
		<div id="key">
			<div id="box1">
				<a href="/about.md" id="logo" class="logo">&#8203;</a>
			</div>
			<div id="box2">
				<button class="save function button-picture">Save</button>
				<button class="new function button-picture enabled">New</button>
				<button class="duplicate function button-picture">Duplicate & Edit</button>
				<button class="raw function button-picture">Just Text</button>
			</div>
			<div id="box3" style="display: none">
				<div class="label"></div>
				<div class="shortcut"></div>
			</div>
		</div>

		<div id="linenos"></div>
		<pre id="box" style="display: none" class="hljs" tabindex="-1"><code></code></pre>
		<textarea spellcheck="false" style="display: none"></textarea>
	</body>
</html>
